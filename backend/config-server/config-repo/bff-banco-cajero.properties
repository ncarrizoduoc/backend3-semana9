server.port=8083

# Información de aplicación (para endpoint /actuator/info)
info.app.name=bff-banco-cajeros
info.app.description=BFF para cajeros automaticos
info.app.version=1.0.0

# Configuración de Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreaker.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka:eureka2026@service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true