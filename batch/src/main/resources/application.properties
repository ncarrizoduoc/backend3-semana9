spring.application.name=banco

spring.datasource.url=jdbc:mysql://localhost:3306/backend3_eft
spring.datasource.username=user_eft
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.platform=mysql

app.input-cuentas=classpath:estados_financieros_anuales.csv
app.input-intereses=classpath:intereses_trimestrales.csv
app.input-transacciones=classpath:movimientos_financieros_diarios.csv

spring.batch.jdbc.initialize-schema=always

spring.batch.job.enabled=false

# Archivo para guardar logs
logging.file.name=logs/app.log